<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{ color-scheme: dark; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0e1013; color:#edeae2; font-family:system-ui,-apple-system,sans-serif;
  }
  .card{ text-align:center; padding:24px; }
  .card p{ color:#8b9099; font-size:.9rem; margin-bottom:22px; }
  #googleBtn{ display:flex; justify-content:center; }
  #msg{ margin-top:16px; font-size:.85rem; color:#8b9099; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <p>Masuk untuk melanjutkan</p>
    <div id="googleBtn"></div>
    <div id="msg"></div>
  </div>

<script>
  // ==== KONFIGURASI — wajib diisi ====
  var OAUTH_CLIENT_ID = 'GANTI_DENGAN_CLIENT_ID_DARI_GOOGLE_CLOUD_CONSOLE';
  var GAS_EXEC_URL = 'GANTI_DENGAN_URL_/exec_DEPLOYMENT_APPS_SCRIPT';
  var DECOY_URL = './decoy.html'; // halaman netral untuk akun yang tidak terdaftar

  function handleCredentialResponse(response) {
    document.getElementById('msg').textContent = 'Memeriksa...';
    fetch(GAS_EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
      body: JSON.stringify({ action: 'requestSession', idToken: response.credential })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.session) {
          window.location.href = GAS_EXEC_URL + '?session=' + encodeURIComponent(data.session);
        } else {
          window.location.href = DECOY_URL;
        }
      })
      .catch(function () {
        window.location.href = DECOY_URL;
      });
  }

  window.onload = function () {
    google.accounts.id.initialize({
      client_id: OAUTH_CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(document.getElementById('googleBtn'), {
      theme: 'filled_black', size: 'large', shape: 'pill'
    });
  };
</script>
</body>
</html>
