<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 40px;
      text-align: center;
      background: #1f2937;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 Test Website</h1>
    <p>Kalau halaman ini muncul, berarti <b>index.html</b> berhasil jalan.</p>

    <button onclick="testButton()">Klik Saya</button>

    <div id="status"></div>
  </div>

  <script>
    function testButton() {
      document.getElementById("status").textContent =
        "✅ JavaScript berhasil bekerja!";
    }
  </script>

</body>
</html>
