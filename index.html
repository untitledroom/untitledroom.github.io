<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{ color-scheme: dark; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0e1013; color:#edeae2; font-family:system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  .card{ width:100%; max-width:320px; text-align:center; }
  .card p{ color:#8b9099; font-size:.9rem; margin-bottom:18px; }
  input{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid #2a2f37;
    background:#171a1f; color:#edeae2; font-size:.95rem; margin-bottom:10px;
  }
  input:focus{ outline:none; border-color:#c9a24b; }
  button{
    width:100%; padding:12px; border-radius:9px; border:none;
    background:#c9a24b; color:#171308; font-weight:600; font-size:.95rem; cursor:pointer;
  }
  button:disabled{ opacity:.6; }
  #msg{ margin-top:14px; font-size:.85rem; color:#8b9099; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <p>Masukkan email untuk menerima link masuk</p>
    <input id="emailInput" type="email" placeholder="nama@email.com" autocomplete="email">
    <button id="sendBtn">Kirim link masuk</button>
    <div id="msg"></div>
  </div>

<script>
  // ==== KONFIGURASI — wajib diisi ====
  var SUPABASE_URL = 'https://lvtalhwtpcvdkuyrwxfq.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_PCSRETdaHJmAxdktMGAGPw_aB22jW19';
  var GAS_EXEC_URL = 'GANTI_DENGAN_URL_/exec_DEPLOYMENT_APPS_SCRIPT';
  var DECOY_URL = './decoy.html';

  var supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var msgEl = document.getElementById('msg');

  // ---- Kirim magic link ----
  document.getElementById('sendBtn').addEventListener('click', async function () {
    var email = document.getElementById('emailInput').value.trim();
    if (!email) { msgEl.textContent = 'Isi email dulu.'; return; }
    this.disabled = true;
    msgEl.textContent = 'Mengirim link...';
    var { error } = await supa.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
    this.disabled = false;
    msgEl.textContent = error ? ('Gagal: ' + error.message) : 'Link terkirim. Cek email kamu.';
  });

  // ---- Setelah klik link di email, Supabase redirect balik ke sini dengan sesi ----
  async function checkExistingSession() {
    var { data } = await supa.auth.getSession();
    var session = data && data.session;
    if (!session) return;

    msgEl.textContent = 'Memeriksa akses...';
    try {
      var resp = await fetch(GAS_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
        body: JSON.stringify({ action: 'requestSession', accessToken: session.access_token })
      });
      var result = await resp.json();
      if (result && result.session) {
        window.location.href = GAS_EXEC_URL + '?session=' + encodeURIComponent(result.session);
      } else {
        window.location.href = DECOY_URL;
      }
    } catch (e) {
      window.location.href = DECOY_URL;
    }
  }

  checkExistingSession();
</script>
</body>
</html>
